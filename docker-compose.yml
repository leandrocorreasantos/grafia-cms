services:
  db:
    image: postgres:15-alpine
    container_name: grafia-db
    environment:
      POSTGRES_USER: grafia_user
      POSTGRES_PASSWORD: grafia_pass
      POSTGRES_DB: grafia_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grafia_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: grafia-adminer
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      ADMINER_DEFAULT_SERVER: db

volumes:
  postgres_data: